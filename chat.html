<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" id="favi" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='15'%20fill='%230b0c10'/%3E%3Ccircle%20cx='20'%20cy='34'%20r='12'%20fill='%238fb0ff'%20fill-opacity='.9'/%3E%3Ccircle%20cx='32'%20cy='34'%20r='12'%20fill='%23b69cff'%20fill-opacity='.85'/%3E%3Ccircle%20cx='44'%20cy='34'%20r='12'%20fill='%23ff8f7a'%20fill-opacity='.85'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://js.puter.com">
<script src="https://js.puter.com/v2/" async onload="window.__puterOK=1;window.dispatchEvent(new Event('puter-ready'))" onerror="window.__puterBlocked=1;window.dispatchEvent(new Event('puter-blocked'))"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Chat · SynthZ</title>
<script>document.documentElement.classList.add('enter')</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0b0c10; --card:rgba(255,255,255,.035); --line:rgba(255,255,255,.09);
  --text:#ecebe7; --soft:#c3c5ce; --mute:#8d909c; --accent:#b8c4ff;
  --ease:cubic-bezier(.22,1,.36,1);
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --sans:'Geist',ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html.lock,html.lock body{overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased}
::selection{background:rgba(184,196,255,.3)}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.hide{display:none !important}

/* fondo */
.aurora{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;will-change:transform}
.aurora i:nth-child(1){width:64vw;height:64vw;left:-18vw;top:-22vw;background:radial-gradient(circle,rgba(74,91,216,.5),transparent 66%)}
.aurora i:nth-child(2){width:56vw;height:56vw;right:-16vw;top:12vh;background:radial-gradient(circle,rgba(154,75,120,.45),transparent 66%)}
.aurora i:nth-child(3){width:60vw;height:60vw;left:18vw;bottom:-32vw;background:radial-gradient(circle,rgba(42,133,134,.45),transparent 66%)}
.grain{position:fixed;inset:0;z-index:-1;opacity:.07;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* logos de las IA */
.lg{display:inline-grid;place-items:center;width:18px;height:18px;flex:none}
.lg svg{width:100%;height:100%;overflow:visible}

/* botones y campos */
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 26px;border-radius:999px;background:var(--text);color:var(--bg);font-weight:500;transition:background .3s,transform .2s}
.btn:hover{background:#fff}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:rgba(255,255,255,.06)}
.btn.sm{padding:8px 16px;font-size:14px}
.btn[disabled]{opacity:.5;pointer-events:none}
.lnk{font-size:14px;color:var(--soft);text-decoration:underline;text-decoration-color:rgba(255,255,255,.25);text-underline-offset:4px;padding:4px 2px}
.field{display:flex;align-items:center;border:1px solid var(--line);border-radius:14px;background:rgba(0,0,0,.25);transition:border-color .3s,background .3s}
.field:focus-within{border-color:rgba(184,196,255,.55);background:rgba(0,0,0,.4)}
.field input,.field textarea{flex:1;min-width:0;background:none;border:0;outline:0;padding:13px 14px;font-size:14.5px}
.field textarea{resize:none}
.field ::placeholder{color:#656875}
.send{flex:none;width:46px;height:46px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center;transition:transform .2s,background .3s,opacity .3s}
.send:hover{background:#fff}
.send:active{transform:scale(.92)}
.send[disabled]{opacity:.35;pointer-events:none}
.send svg{width:20px;height:20px}
.seg{position:relative;display:inline-flex;padding:4px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.2);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;color:var(--mute);font-size:14px;white-space:nowrap;transition:color .3s}
.seg button[aria-selected=true]{color:var(--text)}
.seg .pill{position:absolute;z-index:0;top:4px;bottom:4px;left:0;width:0;border-radius:999px;background:rgba(255,255,255,.1);transition:transform .55s var(--ease),width .55s var(--ease)}
.seg .lg{width:16px;height:16px;opacity:.4;transition:opacity .3s}
.seg button.has .lg{opacity:1}

/* escritura suave, letra por letra, con cursor de código */
[data-typed]{position:relative}
.tc{opacity:0;color:var(--accent);transition:opacity .55s ease,color 1.2s ease}
.tc.on{opacity:1;color:inherit}
.tw{white-space:nowrap}
[data-typed] li,[data-typed] pre,[data-typed] h4{transition:opacity .5s ease}
[data-typed] li:not(.sh),[data-typed] pre:not(.sh),[data-typed] h4:not(.sh){opacity:0}
.tcaret{position:absolute;left:0;top:0;width:2px;height:1em;border-radius:2px;background:var(--accent);box-shadow:0 0 10px 1px rgba(184,196,255,.7);pointer-events:none;opacity:0;transition:opacity .5s ease}
.tcaret.on{opacity:1}
.tcaret.idle{animation:blinkc 1s steps(1) infinite}
@keyframes blinkc{50%{opacity:0}}

#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);opacity:0;z-index:70;padding:12px 20px;border-radius:999px;background:rgba(236,235,231,.96);color:#0b0c10;font-size:14px;transition:all .5s var(--ease);pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.corner{position:fixed;right:12px;bottom:12px;width:15px;height:15px;z-index:40;opacity:.55;pointer-events:none;transition:opacity .8s}
.corner svg{width:100%;height:100%;display:block}
.corner{pointer-events:auto;transition:opacity .8s,transform .6s cubic-bezier(.2,.9,.3,1)}.corner:hover{opacity:1;transform:rotate(90deg) scale(1.5)}

/* ---------- cursor: flecha con viento, vidrio legible y etiqueta nítida ---------- */
.cursor-on,.cursor-on *{cursor:none !important}
#cd,#cr,#cl{position:fixed;left:0;top:0;pointer-events:none}
#cd{width:0;height:0;z-index:10001;opacity:0;transition:opacity .3s}
#ca{position:absolute;left:-2.5px;top:-2.2px;width:22px;height:30px;overflow:visible;transform-origin:2.5px 2.2px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
#cr{z-index:9998;opacity:0;border:1px solid rgba(255,255,255,.38);background:rgba(255,255,255,.1);backdrop-filter:blur(6px) saturate(1.6) brightness(1.12);-webkit-backdrop-filter:blur(6px) saturate(1.6) brightness(1.12);box-shadow:0 10px 34px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.28);transition:opacity .3s,background .3s,border-color .3s}
#cl{z-index:9999;opacity:0;transition:opacity .25s}
.cursor-on #cd{opacity:1}
.cursor-on #cr.link,.cursor-on #cr.txt{opacity:1}
#cs{position:absolute;left:-9px;top:-9px;width:18px;height:18px;opacity:0;pointer-events:none}
#cs svg{width:100%;height:100%;fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(184,196,255,.85))}
.cursor-hide #cd,.cursor-hide #cr,.cursor-hide #cl{opacity:0 !important}
#cr.txt{background:rgba(255,255,255,.92);border-color:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}
.cur-hov{color:transparent !important;text-decoration-color:transparent !important}
.cur-hov:not(select)>*{visibility:hidden}
.rip{position:fixed;left:0;top:0;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);pointer-events:none;z-index:9990}

/* logotipo SynthZ */
.word{display:inline-flex;align-items:center;font-family:var(--serif);font-size:28px;line-height:1;letter-spacing:-.02em}
.zb{width:.8em;height:.8em;margin-left:.08em;overflow:visible;flex:none}

html,body{height:100%;overflow:hidden}
:root{--c:#b8c4ff}
.glow{position:fixed;z-index:-1;right:-12vw;top:-22vh;width:62vw;height:62vw;border-radius:50%;pointer-events:none;background:radial-gradient(circle,var(--c),transparent 62%);opacity:.14;transition:opacity .6s}
.glow.swap{opacity:0}

/* entrada: continúa la expansión que empezó en la página principal */
#veil{position:fixed;inset:0;z-index:300;pointer-events:none;background:#0b0c10;opacity:0;transition:opacity 1.1s ease .05s}
#veil::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 20%,var(--c),transparent 70%);opacity:.18}
html.enter:not(.go) #veil{opacity:1;transition:none}
.side,.top,.composer,.msgs{transition:opacity 1s var(--ease) var(--td,0s),translate 1.1s var(--ease) var(--td,0s)}
html.enter:not(.go) .side{opacity:0;translate:-28px 0}
html.enter:not(.go) .top{opacity:0;translate:0 -18px;--td:.12s}
html.enter:not(.go) .msgs{opacity:0;--td:.2s}
html.enter:not(.go) .composer{opacity:0;translate:0 26px;--td:.3s}
html.bye body{opacity:0;transition:opacity .4s ease}

.shell{display:grid;grid-template-columns:minmax(310px,370px) minmax(0,1fr);height:100vh;height:100dvh}

/* ---------- panel de modelos ---------- */
.side{display:flex;flex-direction:column;gap:12px;padding:20px 16px 14px;border-right:1px solid var(--line);background:rgba(11,12,16,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);min-height:0;position:relative;z-index:5}
.side-head{display:flex;align-items:center;justify-content:space-between}
.back{display:inline-flex;align-items:center;gap:12px;padding:4px 6px;margin-left:-6px;border-radius:12px;color:var(--soft)}
.back svg.arr{width:18px;height:18px;transition:transform .5s var(--ease)}
.back:hover svg.arr{transform:translateX(-4px)}
.back .word{font-size:26px;color:var(--text)}
.x-close{display:none;width:36px;height:36px;border-radius:50%;place-items:center;color:var(--soft)}
.x-close svg{width:20px;height:20px}
.mode .seg{width:100%}
.mode .seg button{flex:1;justify-content:center}

.live{display:flex;align-items:center;gap:9px;padding:8px 8px 8px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-family:var(--mono);font-size:12px;color:var(--mute)}
.live-dot{width:8px;height:8px;border-radius:50%;background:#5b5e6b;flex:none}
.live[data-s=live] .live-dot{background:#7fd6b8;animation:ping 2.2s infinite}
.live[data-s=loading] .live-dot{background:#f2b36b;animation:blink2 .9s ease-in-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(127,214,184,.55)}70%,100%{box-shadow:0 0 0 9px rgba(127,214,184,0)}}
@keyframes blink2{50%{opacity:.35}}
.live b{color:var(--soft);font-weight:500}
.live .sp{flex:1}
.refresh{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;color:var(--mute)}
.refresh svg{width:16px;height:16px;transition:transform .6s var(--ease)}
.refresh:hover{color:var(--text)}
.refresh:hover svg{transform:rotate(120deg)}
.live[data-s=loading] .refresh svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.search{position:relative;padding-left:12px}
.search>svg{width:16px;height:16px;color:var(--mute);flex:none}
.search input{padding:11px 10px !important}
.search kbd{font-family:var(--mono);font-size:11px;color:var(--mute);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;margin-right:10px;transition:opacity .3s}
.search:focus-within kbd,.search.has kbd{display:none}
.qx{display:none;width:30px;height:30px;margin-right:4px;border-radius:50%;place-items:center;color:var(--mute)}
.qx svg{width:14px;height:14px}
.search.has .qx{display:grid}

.filters{display:flex;flex-wrap:wrap;gap:6px}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;color:var(--mute);transition:color .3s,background .3s,border-color .3s}
.fchip:hover{color:var(--soft)}
.fchip[aria-pressed=true]{color:var(--text);background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.24)}
.fchip svg{width:13px;height:13px}
.fchip[data-k=fav][aria-pressed=true] svg{fill:#f2c46b;stroke:#f2c46b}

.sortrow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:11.5px;color:var(--mute)}
.sortrow b{color:var(--soft);font-weight:500;font-variant-numeric:tabular-nums}
.seg.mini{padding:3px}
.seg.mini button{padding:5px 10px;font-size:11.5px;font-family:var(--mono)}
.seg.mini .pill{top:3px;bottom:3px}

.mlist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:5px;padding:6px 6px 14px 0;margin-right:-8px;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(transparent,#000 10px,#000 calc(100% - 26px),transparent);mask-image:linear-gradient(transparent,#000 10px,#000 calc(100% - 26px),transparent)}
.mlist::-webkit-scrollbar{width:8px}
.mlist::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}

.mi{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 8px 10px 12px;border:1px solid transparent;border-radius:16px;text-align:left;transition:background .3s,border-color .3s,box-shadow .4s}
.mi:hover{background:rgba(255,255,255,.04)}
.mi.sel,.mi.on{background:rgba(255,255,255,.07);border-color:var(--line);box-shadow:0 0 30px -14px var(--vc)}
.mi.sel::before{content:"";position:absolute;left:-1px;top:22%;bottom:22%;width:3px;border-radius:3px;background:var(--vc);box-shadow:0 0 12px var(--vc)}
.mi.in{animation:mi-in .55s var(--ease) both;animation-delay:calc(var(--i) * 24ms)}
@keyframes mi-in{from{opacity:0;transform:translateX(-16px)}}
.mi-name{font-family:var(--serif);font-size:19.5px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi-name mark{background:none;color:var(--vc);text-shadow:0 0 14px var(--vc)}
.mi-sub{display:flex;align-items:center;gap:6px;margin-top:5px;font-family:var(--mono);font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden}
.mi-sub .dotsep{opacity:.5}
.tg{font-style:normal;padding:1px 7px;border-radius:999px;border:1px solid var(--line);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);white-space:nowrap}
.tg.free{color:#7fd6b8;border-color:rgba(127,214,184,.35);background:rgba(127,214,184,.08)}
.tg.paid{color:#f2b36b;border-color:rgba(242,179,107,.35);background:rgba(242,179,107,.08)}
.tg.new{color:#0b0c10;border-color:transparent;background:linear-gradient(90deg,#8fb0ff,#b69cff,#ff8f7a,#8fb0ff);background-size:200% 100%;animation:sheen 3s linear infinite}
@keyframes sheen{to{background-position:-200% 0}}

.av{position:relative;flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:var(--serif);font-size:22px;line-height:1;color:#0b0c10;background:linear-gradient(140deg,var(--vc),color-mix(in srgb,var(--vc) 50%,#fff))}
.av.xs{width:20px;height:20px;border-radius:7px;font-size:13px}
.av.big{width:50px;height:50px;border-radius:16px;font-size:30px;animation:avpop .7s var(--ease) both}
@keyframes avpop{from{transform:scale(.6) rotate(-8deg);opacity:0}}
.av .n{position:absolute;right:-6px;top:-6px;width:19px;height:19px;border-radius:50%;background:var(--text);color:var(--bg);font:600 11px var(--mono);display:grid;place-items:center;transform:scale(0);transition:transform .45s var(--ease)}
.mi.on .av .n{transform:scale(1)}
.mi.busy .av{animation:busyav 1.1s ease-in-out infinite}
@keyframes busyav{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--vc) 30%,transparent)}}

.star{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--mute);opacity:.45;transition:opacity .3s,color .3s}
.star svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.mi:hover .star{opacity:1}
.mi.fav .star{opacity:1;color:#f2c46b}
.mi.fav .star svg{fill:#f2c46b}
.star.pop svg{animation:starpop .55s var(--ease)}
@keyframes starpop{35%{transform:scale(1.6) rotate(18deg)}}

.msk{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:12px;padding:10px 12px}
.msk i{display:block;border-radius:12px;width:38px;height:38px}
.msk div{display:flex;flex-direction:column;gap:8px}
.msk b{display:block;height:11px;border-radius:6px}
.msk i,.msk b{background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.14),rgba(255,255,255,.05));background-size:200% 100%;animation:shimmer 1.4s infinite linear}
.msk b:nth-child(2){width:55%}
.mnone{margin:auto;text-align:center;padding:34px 18px;color:var(--mute);font-size:13.5px}
.mnone h4{font-family:var(--serif);font-weight:400;font-size:26px;color:var(--soft);margin-bottom:6px}
.mnone .btn{margin-top:14px}
.mwarn{padding:10px 12px;border:1px solid rgba(242,179,107,.3);background:rgba(242,179,107,.07);border-radius:12px;font-size:12.5px;color:#f2c9a0;margin-bottom:4px}

.side-foot{font-family:var(--mono);font-size:12px;color:var(--mute);line-height:1.7;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.side-foot b{color:var(--soft);font-weight:500;font-variant-numeric:tabular-nums}
.side-done{display:none}

/* ---------- zona principal ---------- */
.main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px clamp(16px,3vw,32px);border-bottom:1px solid var(--line);min-height:86px}
.menu{display:none;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:13px;color:var(--soft);flex:none}
.menu svg{width:16px;height:16px}
.title{display:flex;align-items:center;gap:14px;min-width:0}
.t-main{min-width:0}
.title h1{font-family:var(--serif);font-weight:400;font-size:clamp(28px,3.2vw,38px);line-height:1.02;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(44vw,560px)}
.t-meta{display:flex;align-items:center;gap:8px;margin-top:7px;font-family:var(--mono);font-size:11.5px;color:var(--mute);flex-wrap:wrap}
.t-desc{margin-top:6px;font-size:12.5px;color:var(--mute);max-width:62ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cchip{display:inline-flex;align-items:center;gap:8px;padding:4px 6px 4px 5px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-family:var(--sans);font-size:12.5px;color:var(--soft);animation:chipin .5s var(--ease) both}
.cchip .rm{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--mute)}
.cchip .rm svg{width:11px;height:11px}
.cchip .rm:hover{color:var(--text)}
.now{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;flex:none}
.now-chip{display:inline-flex;align-items:center;gap:9px;padding:7px 14px 7px 8px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--soft);animation:chipin .5s var(--ease) both}
.now-chip.live{border-color:color-mix(in srgb,var(--vc) 55%,transparent);box-shadow:0 0 22px -6px var(--vc)}
.now-chip b{font-weight:500;color:var(--text);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now-chip em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--mute)}
.now-chip.idle{color:var(--mute);font-family:var(--mono);font-size:12px;padding:7px 14px}
.now.many .now-chip em{display:none}
.now.many .now-chip{padding:6px 11px 6px 6px;gap:8px}
.dots{display:inline-flex;gap:3px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--vc,var(--c));animation:bounce 1.1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
@keyframes chipin{from{opacity:0;transform:translateY(-6px) scale(.96)}}

.msgs{flex:1;min-height:0;overflow-y:auto;padding:30px clamp(16px,4vw,48px) 20px;overscroll-behavior:contain}
.msgs::-webkit-scrollbar{width:8px}
.msgs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}
.lane{width:min(100%,840px);margin:0 auto;display:flex;flex-direction:column;gap:26px;min-height:100%}
.empty{margin:auto;text-align:center;color:var(--mute);max-width:46ch;padding:40px 0}
.empty .av{width:84px;height:84px;border-radius:26px;font-size:50px;margin:0 auto 22px;animation:avpop .8s var(--ease) both}
.empty .av::after{content:"";position:absolute;inset:-10px;border-radius:34px;border:1px solid var(--vc);opacity:0;animation:ring 2.8s ease-out infinite}
@keyframes ring{from{transform:scale(.9);opacity:.55}to{transform:scale(1.4);opacity:0}}
.empty h4{font-family:var(--serif);font-weight:400;font-size:clamp(30px,4vw,44px);color:var(--soft);line-height:1.05;margin-bottom:10px}
.empty p{font-size:14.5px}
.empty .btn{margin-top:18px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:26px}
.sugg button{padding:9px 15px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:13.5px;color:var(--soft);transition:background .3s,color .3s,border-color .3s;animation:chipin .6s var(--ease) both;animation-delay:calc(var(--i) * 90ms + 300ms)}
.sugg button:hover{background:rgba(255,255,255,.08);color:var(--text)}

.m{animation:pop .6s var(--ease) both}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.985)}}
.m.user{align-self:flex-end;max-width:min(82%,640px)}
.m.user .who{justify-content:flex-end}
.m.user .bub{background:rgba(255,255,255,.09);padding:12px 18px;border-radius:22px 22px 6px 22px;white-space:pre-wrap;word-break:break-word}
.who{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--mute);margin-bottom:8px;flex-wrap:wrap}
.who b{color:var(--soft);font-weight:500}
.who .md::before{content:"▸ ";opacity:.6}
.who .wr{display:none;align-items:center;gap:7px;color:var(--vc)}
.who .tk{font-variant-numeric:tabular-nums}
.m.writing .who .wr{display:inline-flex}
.m.writing .who .md{display:none}
.m.bot{position:relative;padding:2px 0 2px 18px;max-width:100%;--vc:var(--c)}
.m.bot::before{content:"";position:absolute;left:0;top:0;width:2px;height:calc(var(--p,1) * 100%);border-radius:2px;background:var(--c);box-shadow:0 0 12px -1px var(--c)}
.m.bot .body{line-height:1.7}
.body p{margin:0 0 .75em}
.body p:last-child{margin:0}
.body ul,.body ol{padding-left:1.3em;margin:0 0 .75em}
.body h4{font-weight:600;margin:.9em 0 .3em}
.body a{text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(255,255,255,.35)}
.body code{font-family:var(--mono);font-size:.88em;background:rgba(255,255,255,.08);padding:.12em .4em;border-radius:6px}
.body pre{position:relative;background:rgba(0,0,0,.42);border:1px solid var(--line);border-radius:14px;padding:16px;overflow-x:auto;margin:.6em 0 .9em;font-family:var(--mono);font-size:13.5px;line-height:1.65}
.body pre code{background:none;padding:0;font-size:inherit}
.cpc{position:absolute;right:8px;top:8px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:rgba(11,12,16,.8);font-family:var(--mono);font-size:11px;color:var(--mute);opacity:0;transition:opacity .3s,color .3s}
.body pre:hover .cpc,.cpc:focus-visible{opacity:1}
.cpc.ok{color:#7fd6b8;border-color:rgba(127,214,184,.4)}
.m .meta{margin-top:10px;font-family:var(--mono);font-size:11.5px;color:var(--mute)}
.acts{display:flex;gap:6px;margin-top:8px;opacity:0;transition:opacity .35s}
.m:hover .acts,.acts:focus-within,.m.last .acts{opacity:1}
.act{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);font-family:var(--mono);font-size:11.5px;color:var(--mute);transition:color .3s,border-color .3s,background .3s}
.act:hover{color:var(--text);background:rgba(255,255,255,.05)}
.act svg{width:13px;height:13px}
.act.ok{color:#7fd6b8;border-color:rgba(127,214,184,.4)}
.m.err{align-self:center;color:#ffb3a7;background:rgba(255,120,100,.08);border:1px solid rgba(255,120,100,.25);padding:10px 16px;border-radius:14px;font-size:14px;text-align:center;max-width:min(90%,560px)}
.think{display:flex;flex-direction:column;gap:8px;padding:6px 0}
.skel{height:10px;border-radius:6px;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.16),rgba(255,255,255,.05));background-size:200% 100%;animation:shimmer 1.4s infinite linear}
.skel:nth-child(1){width:88%}.skel:nth-child(2){width:72%}.skel:nth-child(3){width:46%}
@keyframes shimmer{to{background-position:-200% 0}}
.stat{font-family:var(--mono);font-size:12px;color:var(--mute);display:inline-flex;align-items:center;gap:8px}

/* comparar */
.cmp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.cmp-card{border:1px solid var(--line);border-radius:20px;padding:18px;background:rgba(0,0,0,.2);display:flex;flex-direction:column;gap:12px;min-height:150px;animation:pop .7s var(--ease) both;position:relative;overflow:hidden;--vc:var(--c)}
.cmp-card::before{content:"";position:absolute;left:0;top:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--c),transparent);opacity:0;transition:opacity .4s}
.cmp-card.live::before{opacity:1}
.cmp-card.fast{border-color:color-mix(in srgb,var(--c) 50%,transparent);box-shadow:0 0 36px -14px var(--c)}
.cmp-card .who{margin:0}
.cmp-card .who .stat{margin-left:auto}
.cmp-card .body{font-size:14.5px;color:var(--soft);line-height:1.65}
.cmp-card .meta{font-family:var(--mono);font-size:11.5px;color:var(--mute);margin-top:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cmp-card .acts{opacity:1;margin:0}
.badge-fast{display:none;align-items:center;gap:5px;color:#0b0c10;background:var(--c);padding:1px 9px;border-radius:999px;font-weight:600;font-size:10.5px;letter-spacing:.03em;animation:avpop .6s var(--ease) both}
.cmp-card.fast .badge-fast{display:inline-flex}

.tobottom{position:absolute;right:clamp(16px,4vw,48px);bottom:112px;z-index:6;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(236,235,231,.95);color:var(--bg);box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;transform:translateY(12px) scale(.9);pointer-events:none;transition:opacity .4s var(--ease),transform .5s var(--ease)}
.tobottom.show{opacity:1;transform:none;pointer-events:auto}
.tobottom svg{width:18px;height:18px}

/* ---------- caja de escribir ---------- */
.composer{padding:10px clamp(16px,4vw,48px) 28px}
.comp-in{width:min(100%,840px);margin:0 auto;display:flex;align-items:flex-end;gap:10px}
.comp-in .field{flex:1;min-width:0;align-items:flex-end;border-radius:22px;background:rgba(0,0,0,.35)}
.comp-in textarea{min-width:0;width:100%;max-height:170px;line-height:1.5;padding:15px 18px;font-size:15.5px}
.hintline{width:min(100%,840px);margin:10px auto 0;font-family:var(--mono);font-size:11.5px;color:var(--mute);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hintline a{text-decoration:underline;text-underline-offset:3px}
#scrim{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .45s ease}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(92vw,410px);z-index:80;transform:translateX(-105%);transition:transform .6s var(--ease);background:rgba(11,12,16,.96);box-shadow:30px 0 80px rgba(0,0,0,.55);padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .side.open{transform:none}
  #scrim.on{opacity:1;pointer-events:auto}
  .x-close{display:grid}
  .menu{display:inline-flex}
  .side-done{display:inline-flex;justify-content:center}
  .top{flex-wrap:wrap;gap:10px;padding:12px 16px;min-height:0}
  .title h1{max-width:60vw}
  .t-desc{display:none}
  .now{justify-content:flex-start;flex:1 1 100%}
  .tobottom{bottom:104px}
}
@media (prefers-reduced-motion:reduce) and (max-width:0px){ .m,.cmp-card,.now-chip,.mi.in,.sugg button,.cchip{animation:none} .side{transition:none} }

/* ===== v2: cursor de carga, portal Z, escritura con brillo ===== */
#cw{position:absolute;left:-11px;top:-11px;width:22px;height:22px;border-radius:50%;opacity:0;scale:.4;transition:opacity .25s,scale .45s var(--ease);background:conic-gradient(#ff5f57,#ffbd2e,#d9e84f,#28c840,#1ec8ff,#7c5cff,#ff5fb7,#ff5f57);-webkit-mask:radial-gradient(circle,transparent 3.5px,#000 4.5px);mask:radial-gradient(circle,transparent 3.5px,#000 4.5px);filter:drop-shadow(0 2px 5px rgba(0,0,0,.45))}
.cursor-busy #cw{opacity:1;scale:1;animation:cwspin .9s linear infinite}
#cd.mini #cw{opacity:0 !important}
@keyframes cwspin{to{rotate:360deg}}
.pz{position:absolute;left:50%;top:50%;width:132px;height:132px;margin:-66px 0 0 -66px;pointer-events:none}
.pz svg{display:block;width:100%;height:100%;overflow:visible}
#portal{position:fixed;inset:0;z-index:9500;background:#0b0c10;pointer-events:none;opacity:0}
#portal .pg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%,rgba(182,156,255,.24),transparent 60%)}
.field.mw{position:relative}
.mir{position:absolute;inset:0;pointer-events:none;overflow:hidden;white-space:pre-wrap;overflow-wrap:break-word;color:var(--text);z-index:0}
.field.mw textarea{position:relative;z-index:1;color:transparent;caret-color:var(--accent);scrollbar-width:none}
.field.mw textarea::-webkit-scrollbar{display:none}
@keyframes nw{0%{opacity:0;color:var(--accent);text-shadow:0 0 18px var(--accent),0 0 4px var(--accent)}40%{opacity:1;color:var(--accent);text-shadow:0 0 12px rgba(184,196,255,.8)}100%{color:var(--text);text-shadow:0 0 0 transparent}}
.mir .nw{animation:nw .9s var(--ease) both}

html.enter #veil{background:#b39eff}
.attach{flex:none;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--soft);background:rgba(0,0,0,.25);transition:background .3s,color .3s,transform .2s}
.attach:hover{background:rgba(255,255,255,.08);color:var(--text)}.attach:active{transform:scale(.92)}.attach svg{width:20px;height:20px}
.tray{width:min(100%,840px);margin:0 auto 10px;display:flex;flex-wrap:wrap;gap:8px}.tray:empty{display:none}
.fc{display:inline-flex;align-items:center;gap:8px;max-width:250px;padding:5px 6px 5px 5px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:12.5px;color:var(--soft);animation:avpop .5s var(--ease) both}
.fc img,.fc .ic{width:30px;height:30px;border-radius:8px;object-fit:cover;flex:none}
.fc .ic{display:grid;place-items:center;background:rgba(255,255,255,.09);font:600 9.5px var(--mono);text-transform:uppercase;color:var(--text);font-style:normal}
.fc b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fc .x{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--mute);flex:none}.fc .x svg{width:12px;height:12px}
.fc.ro{padding-right:10px}
.fc.load .ic,.fc.load img{background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.2),rgba(255,255,255,.06));background-size:200% 100%;animation:shimmer 1.2s infinite linear}
.fc.err{border-color:rgba(255,140,120,.5)}
.fcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
body.drag::after{content:"Suelta tus archivos aquí";position:fixed;inset:14px;z-index:9000;display:grid;place-items:center;border:2px dashed rgba(184,196,255,.6);border-radius:26px;background:rgba(11,12,16,.72);backdrop-filter:blur(8px);font-family:var(--serif);font-size:30px;pointer-events:none}

/* ===== v3: fondo de 3 círculos, menú contextual, flotado ===== */
.aurora i{border-radius:50%;filter:blur(34px);opacity:.62;animation:orb 22s ease-in-out infinite alternate;translate:calc(var(--mx,0) * var(--k,1) * 1px) calc(var(--my,0) * var(--k,1) * 1px);transition:translate .9s var(--ease)}
.aurora i:nth-child(1){--k:.7;width:46vmax;height:46vmax;left:-12vmax;top:-14vmax;background:#8fb0ff}
.aurora i:nth-child(2){--k:-1;width:42vmax;height:42vmax;right:-14vmax;top:18vh;background:#b69cff;animation-duration:27s;animation-delay:-8s}
.aurora i:nth-child(3){--k:1.3;width:44vmax;height:44vmax;left:22vw;bottom:-26vmax;background:#ff8f7a;animation-duration:31s;animation-delay:-15s}
.aurora::after{content:"";position:absolute;inset:0;backdrop-filter:blur(46px) saturate(1.25);-webkit-backdrop-filter:blur(46px) saturate(1.25);background:rgba(11,12,16,.52)}
@keyframes orb{to{transform:translate3d(6vmax,-4vmax,0) scale(1.12)}}
@keyframes drift{0%,100%{translate:0 0;rotate:0deg}25%{translate:4px -5px;rotate:.25deg}50%{translate:-3px -8px;rotate:-.2deg}75%{translate:-5px -3px;rotate:.15deg}}
.ctxm{position:fixed;z-index:9800;min-width:220px;padding:6px;display:flex;flex-direction:column;border:1px solid rgba(255,255,255,.14);border-radius:16px;background:rgba(18,19,26,.62);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);box-shadow:0 20px 60px rgba(0,0,0,.5);animation:drift 9s ease-in-out infinite}
.ctxm button{text-align:left;padding:9px 12px;border-radius:10px;font-size:14px;color:var(--soft);transition:background .25s,color .25s}
.ctxm button:hover{background:rgba(255,255,255,.09);color:var(--text)}

#tour{position:fixed;inset:0;z-index:9700;display:grid;place-items:center;padding:18px;background:rgba(5,6,10,.5);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);opacity:0;transition:opacity .5s ease}
#tour.on{opacity:1}
.tcard{position:relative;width:min(92vw,470px);padding:30px 30px 24px;border:1px solid rgba(255,255,255,.14);border-radius:30px;background:rgba(18,19,26,.66);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);box-shadow:0 30px 90px rgba(0,0,0,.55);overflow:hidden;animation:drift 10s ease-in-out infinite}
.tcard::before{content:"";position:absolute;inset:-30% -20% auto;height:80%;background:radial-gradient(ellipse at 50% 0,var(--tc,#b69cff),transparent 70%);opacity:.32;transition:background .8s;pointer-events:none}
.tcard>*{position:relative}
.tn{font:12px var(--mono);color:var(--mute);letter-spacing:.08em;margin:18px 0 8px}
.tcard h3{font-family:var(--serif);font-weight:400;font-size:40px;line-height:1.02;letter-spacing:-.015em}
.tcard p{margin-top:12px;color:var(--soft);font-size:15.5px;min-height:5em}
.tdots{display:flex;gap:6px;margin:18px 0}
.tdots i{height:4px;width:14px;border-radius:4px;background:rgba(255,255,255,.18);transition:width .5s var(--ease),background .4s}
.tdots i.on{width:34px;background:var(--tc,#b69cff)}
.tbtn{display:flex;align-items:center;justify-content:space-between;gap:10px}
/* v4: el body opaco tapaba el fondo */
html body{background:transparent}

/* ===== v5: cursor de texto, fondo con celeste, ventana de conexión ===== */
#ci{position:absolute;left:-1px;top:-11px;width:2px;height:22px;border-radius:2px;background:#fff;box-shadow:0 0 10px rgba(184,196,255,.85);opacity:0;scale:.4 1;transition:opacity .2s,scale .3s var(--ease)}
.cursor-text #ci{opacity:1;scale:1 1}
.cursor-text #ca{opacity:0 !important}
.cursor-typing #cd{opacity:0 !important}
.aurora i:nth-child(4){--k:-.6;width:34vmax;height:34vmax;right:12vw;bottom:-12vmax;background:#6fd3d6;opacity:.4;animation-duration:25s;animation-delay:-4s}
.aurora::before{content:"";position:absolute;inset:0;z-index:1;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.2px);background-size:30px 30px;-webkit-mask:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 75%);mask:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 75%)}
#conn{position:fixed;inset:0;z-index:9700;display:grid;place-items:center;padding:18px;background:rgba(5,6,10,.5);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);opacity:0;transition:opacity .5s ease}
#conn.on{opacity:1}

.cursor-busy #ci{opacity:0 !important}
.cbox{display:flex;gap:8px;align-items:center;margin-top:12px}
.cbox input{flex:1;min-width:0;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.28);color:var(--text);font:13px var(--mono)}
.cbox span{flex:1;color:var(--soft);font-size:14px}
.cbox .ok{color:#7fd6b8;font-size:13px}

/* v7: fondo optimizado: degradados suaves en vez de filtros de desenfoque animados */
.aurora{contain:strict}
.aurora i{filter:none;opacity:.9;will-change:transform}
.aurora i:nth-child(1){background:radial-gradient(circle,rgba(143,176,255,.95) 0%,rgba(143,176,255,.35) 38%,transparent 68%)}
.aurora i:nth-child(2){background:radial-gradient(circle,rgba(182,156,255,.95) 0%,rgba(182,156,255,.35) 38%,transparent 68%)}
.aurora i:nth-child(3){background:radial-gradient(circle,rgba(255,143,122,.9) 0%,rgba(255,143,122,.32) 38%,transparent 68%)}
.aurora i:nth-child(4){background:radial-gradient(circle,rgba(111,211,214,.85) 0%,rgba(111,211,214,.28) 38%,transparent 68%);opacity:.55}
.aurora::after{backdrop-filter:none;-webkit-backdrop-filter:none;background:radial-gradient(ellipse at 50% 30%,rgba(11,12,16,.22),rgba(11,12,16,.5) 78%)}

/* v7: proveedores separados, ayuda con bloqueadores, avisos de límite */
.prov{margin:2px 0 10px;width:100%;display:grid;grid-template-columns:repeat(3,1fr)}
.prov button{text-align:center}
.mgrp{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:14px 8px 6px;position:sticky;top:-1px;z-index:2;background:linear-gradient(var(--bg) 70%,transparent)}
.mgrp b{font-family:var(--serif);font-weight:400;font-size:22px;color:var(--text)}
.mgrp span{font:11px var(--mono);letter-spacing:.04em;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--mute)}
.mgrp span.on{color:#7fd6b8;border-color:rgba(127,214,184,.35)}
.mgrp small{width:100%;color:var(--mute);font-size:11.5px}
.cnote{margin-top:6px;color:var(--mute);font-size:12.5px;line-height:1.45}
.m.err .swb{margin-top:10px}
#blk{position:fixed;inset:0;z-index:9750;display:grid;place-items:center;padding:18px;background:rgba(5,6,10,.55);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);opacity:0;transition:opacity .45s ease}
#blk.on{opacity:1}
#blk .tcard{width:min(94vw,520px)}
#blk .tcard p,#conn .tcard p{min-height:0}
.bbar{display:flex;align-items:center;gap:8px;margin:18px 0 6px;padding:8px 10px;border:1px solid rgba(255,255,255,.14);border-radius:14px;background:rgba(0,0,0,.35)}
.bbar .dots{display:flex;gap:5px}.bbar .dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.18)}
.bbar .url{flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9px;background:rgba(255,255,255,.07);font:12px var(--mono);color:var(--soft);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bbar .bi{position:relative;flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--soft)}

/* v9: péndulo de Newton en el logo (muy leve); al pasar el mouse se separan y crecen la S y la z */
.mark{overflow:visible}
.mark .sw{transform-box:view-box}
.mark .sw1{transform-origin:11px -25px;animation:swL 2.8s infinite}
.mark .sw3{transform-origin:33px -25px;animation:swR 2.8s infinite}
@keyframes swL{0%{transform:rotate(0deg);animation-timing-function:cubic-bezier(.25,.75,.45,1)}16%{transform:rotate(11deg);animation-timing-function:cubic-bezier(.55,0,.75,.25)}32%,100%{transform:rotate(0deg)}}
@keyframes swR{0%,50%{transform:rotate(0deg);animation-timing-function:cubic-bezier(.25,.75,.45,1)}66%{transform:rotate(-11deg);animation-timing-function:cubic-bezier(.55,0,.75,.25)}82%,100%{transform:rotate(0deg)}}
.mark circle{transition:transform .6s var(--ease);transform-box:fill-box;transform-origin:center}
.mark text{transition:transform .55s var(--ease);transform-box:fill-box;transform-origin:center}
a:hover .mark .b1,.logo:hover .mark .b1{transform:translateX(-3px)}

.main{background:linear-gradient(180deg,rgba(7,8,11,.84),rgba(7,8,11,.9))}

/* ===== v10 ===== */
/* péndulo de Newton rápido y seguido: tin, sale, tin, sale */
.mark .sw1{animation:swL 1.15s infinite}
.mark .sw3{animation:swR 1.15s infinite}
@keyframes swL{0%{transform:rotate(0deg);animation-timing-function:cubic-bezier(.2,.7,.4,1)}25%{transform:rotate(13deg);animation-timing-function:cubic-bezier(.6,0,.8,.3)}50%,100%{transform:rotate(0deg)}}
@keyframes swR{0%,50%{transform:rotate(0deg);animation-timing-function:cubic-bezier(.2,.7,.4,1)}75%{transform:rotate(-13deg);animation-timing-function:cubic-bezier(.6,0,.8,.3)}100%{transform:rotate(0deg)}}
/* al pasar el mouse: deja el péndulo, crece un poquito, se separan y crecen la S y la z */
.logo .mark,.back .mark{transition:transform .5s var(--ease),opacity .8s var(--ease)}
.logo:hover .mark .sw,a:hover .mark .sw{animation:none}
.logo:hover .mark,a:hover .mark{transform:scale(1.1)}
/* fondo repartido por toda la pantalla y que gira suave al bajar */
.aurora .orbit{position:absolute;inset:0;transform:rotate(calc(var(--sp,0) * 140deg)) scale(calc(1 + var(--sp,0) * .18));transition:transform .5s cubic-bezier(.2,.7,.3,1);will-change:transform}
.aurora .orbit i:nth-child(1){left:-16vmax;top:-18vmax;right:auto;bottom:auto}
.aurora .orbit i:nth-child(2){right:-16vmax;top:-12vmax;left:auto;bottom:auto}
.aurora .orbit i:nth-child(3){left:-12vmax;bottom:-24vmax;right:auto;top:auto}
.aurora .orbit i:nth-child(4){right:-8vmax;bottom:-18vmax;left:auto;top:auto}
.aurora::after{background:radial-gradient(ellipse at calc(50% + var(--sp,0) * 30%) calc(30% + var(--sp,0) * 45%),rgba(11,12,16,.2),rgba(11,12,16,.5) 78%)}
/* modo rendimiento: sin vidrios, sin fondo animado, sin péndulo */
html.noglass *,html.noglass *::before,html.noglass *::after{backdrop-filter:none !important;-webkit-backdrop-filter:none !important}
html.noglass .tcard,html.noglass .ctxm{background:#15161d !important}
html.nobg .aurora i{animation:none !important;opacity:.45}
html.nobg .aurora .orbit{transform:none !important}
html.noanim .mark .sw,html.noanim .tcard,html.noanim .ctxm{animation:none !important}
html.nocur .cursor-on,html.nocur .cursor-on *{cursor:auto !important}
html.nocur #cd,html.nocur #cr,html.nocur #cl{display:none !important}
/* ventanas flotantes comunes */
.szm{position:fixed;inset:0;z-index:9730;display:grid;place-items:center;padding:18px;background:rgba(5,6,10,.55);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);opacity:0;transition:opacity .45s ease}
.szm.on{opacity:1}
.szm .tcard{width:min(94vw,520px);max-height:90vh;overflow-y:auto;scrollbar-width:thin}
.szm .tcard p{min-height:0}
.authc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.authc .full{grid-column:1 / -1;justify-self:center}
.cfgo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.cfgo button{position:relative;display:flex;flex-direction:column;gap:4px;text-align:left;padding:12px;border:1px solid var(--line);border-radius:16px;background:rgba(0,0,0,.22);color:var(--soft);transition:border-color .3s,background .3s,transform .3s var(--ease)}
.cfgo button:hover{transform:translateY(-2px)}
.cfgo button b{font-family:var(--serif);font-weight:400;font-size:20px;line-height:1.1;color:var(--text)}
.cfgo button span{font-size:12px;color:var(--mute);line-height:1.4}
.cfgo button[aria-pressed="true"]{border-color:rgba(182,156,255,.7);background:rgba(182,156,255,.14)}
.cfgo .rec{position:absolute;top:-9px;right:10px;padding:1px 8px;border-radius:20px;background:#7fd6b8;color:#0b0c10;font:600 10px var(--sans)}
.cfgrow{display:flex;align-items:center;gap:12px;margin-top:8px;padding:11px 14px;border:1px solid var(--line);border-radius:14px}
.cfgrow p{flex:1;margin:0;font-size:13.5px;color:var(--soft)}
.cfgrow p small{display:block;font-size:12px;color:var(--mute)}
.cfgsw{flex:none;width:44px;height:26px;border-radius:20px;background:rgba(255,255,255,.14);position:relative;transition:background .3s}
.cfgsw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .35s var(--ease)}
.cfgsw[aria-pressed="true"]{background:#5fbf9c}
.cfgsw[aria-pressed="true"]::after{transform:translateX(18px)}
.cfglbl{margin-top:16px;font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
/* miniatura: así se verá la página */
.mp{position:relative;height:138px;margin-top:12px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#0b0c10;animation:mpin .6s cubic-bezier(.22,1,.36,1) both}
@keyframes mpin{from{opacity:0;transform:translateY(10px) scale(.97);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.mp .bl{position:absolute;border-radius:50%;filter:blur(16px);opacity:.85;animation:mpf 5s ease-in-out infinite alternate}
.mp .bl:nth-child(1){width:96px;height:96px;left:-26px;top:-30px;background:#8fb0ff}
.mp .bl:nth-child(2){width:86px;height:86px;right:-20px;top:-16px;background:#b69cff;animation-delay:-2s}

@keyframes mpf{to{transform:translate(14px,8px) scale(1.12)}}
.mp .gl{position:absolute;inset:0;background:rgba(11,12,16,.32)}
.mp .nv{position:absolute;left:10px;right:10px;top:9px;display:flex;align-items:center;gap:6px}
.mp .nv i{width:24px;height:9px;border-radius:5px;background:linear-gradient(90deg,#8fb0ff,#b69cff,#ff8f7a)}
.mp .nv b{width:18px;height:5px;border-radius:3px;background:rgba(255,255,255,.3)}
.mp .nv b:last-child{margin-left:auto;width:30px;height:10px;border-radius:6px}
.mp .h1{position:absolute;left:50%;top:36px;transform:translateX(-50%);width:62%;height:12px;border-radius:6px;background:rgba(255,255,255,.88)}

.mp .cds{position:absolute;left:10px;right:10px;bottom:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

.mp .cu{position:absolute;left:62%;top:48%;width:16px;height:16px;border-radius:50%;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.12);box-shadow:0 0 12px rgba(184,196,255,.6);animation:mpc 3.4s ease-in-out infinite}
@keyframes mpc{50%{transform:translate(-40px,14px)}}
.mp em{position:absolute;right:8px;top:8px;padding:2px 8px;border-radius:20px;background:rgba(0,0,0,.55);font:10.5px var(--mono);font-style:normal;color:var(--soft)}
.mp.speed{background:#101116}
.mp.speed .bl,.mp.speed .gl,.mp.speed .cu{display:none}
.mp.speed .cds b{background:#1a1b22;border-color:#2a2b33;backdrop-filter:none;box-shadow:none}
.mp.speed .nv i{background:#8fb0ff}
.mp.speed .h2{background:#9aa3c7}

/* v10: lista de modelos virtual (solo se dibuja lo que se ve) */
.mlist{position:relative;display:block}
.vwin{position:relative}
.vrow{position:absolute;left:0;right:0}
.vrow>.mgrp{position:static;background:none}
/* filtros: se arrastran, se mueven con la ruedita y tienen flechas */
.fwrap{position:relative}
.filters{cursor:grab;-webkit-mask:none;mask:none;padding-right:0;scroll-behavior:smooth}
.filters.dragging{cursor:grabbing;scroll-behavior:auto}
.filters.dragging .fchip{pointer-events:none}
.filters.l.r{-webkit-mask:linear-gradient(90deg,transparent,#000 30px,#000 calc(100% - 30px),transparent);mask:linear-gradient(90deg,transparent,#000 30px,#000 calc(100% - 30px),transparent)}
.filters.r:not(.l){-webkit-mask:linear-gradient(90deg,#000 calc(100% - 34px),transparent);mask:linear-gradient(90deg,#000 calc(100% - 34px),transparent)}
.filters.l:not(.r){-webkit-mask:linear-gradient(90deg,transparent,#000 34px);mask:linear-gradient(90deg,transparent,#000 34px)}

.cfgb{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--mute);border:1px solid var(--line);transition:color .3s,background .3s}

.side-head .back{margin-right:auto}
.team{margin-top:8px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(0,0,0,.2)}
.team h4{font-family:var(--serif);font-weight:400;font-size:22px;margin:0 0 6px}
.tmem{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tmem span{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;border:1px solid var(--line);border-radius:20px;font-size:12.5px;color:var(--soft)}
.tmem span button{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:var(--mute)}
.tmem span button:hover{color:#ff8f7a}
.tinv{display:flex;gap:8px;margin-top:6px}
.tinv input{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.28);color:var(--text);font:13.5px var(--sans)}
.tlist{display:grid;gap:8px;margin-top:8px}
.tbeta{font:10px var(--mono);padding:1px 7px;border-radius:20px;border:1px solid rgba(182,156,255,.5);color:#cbbcff;margin-left:6px;vertical-align:2px}

/* ===== v11 ===== */
/* cursor del botón del medio (desplazamiento automático) */
#cm{position:absolute;left:-15px;top:-15px;width:30px;height:30px;opacity:0;scale:.5;transition:opacity .2s,scale .35s var(--ease)}
#cm svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 8px rgba(184,196,255,.7))}
.cursor-mid #cm{opacity:1;scale:1}
.cursor-mid #ca,.cursor-mid #ci,.cursor-mid #cw,.cursor-mid #cs{opacity:0 !important}
/* respuestas en vivo */
.scaret{display:inline-block;width:.5em;height:1.05em;margin-left:2px;vertical-align:-.18em;border-radius:2px;background:linear-gradient(180deg,#b8c4ff,#b69cff);box-shadow:0 0 12px rgba(182,156,255,.8);animation:scb 1s ease-in-out infinite}
@keyframes scb{50%{opacity:.35}}
/* confirmaciones con vidrio */
.szc .tbtn .btn.warn{background:#ff8f7a;color:#0b0c10}
.cfgseg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.cfgseg button{padding:9px 6px;border:1px solid var(--line);border-radius:12px;font-size:12.5px;color:var(--soft);transition:all .25s}
.cfgseg button[aria-pressed="true"]{color:var(--text);border-color:rgba(182,156,255,.7);background:rgba(182,156,255,.14)}

/* v11: conversaciones */
.thb{flex:none;display:inline-flex;align-items:center;gap:7px;padding:7px 13px 7px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.25);color:var(--soft);font-size:13px;transition:background .3s,color .3s}
.thb:hover{background:rgba(255,255,255,.07);color:var(--text)}
.thb svg{width:16px;height:16px}
.thb b{font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
#thPop{position:absolute;z-index:60;top:92px;right:clamp(12px,3vw,32px);width:min(92vw,400px);max-height:min(70vh,560px);display:flex;flex-direction:column;border:1px solid rgba(255,255,255,.14);border-radius:22px;background:rgba(16,17,23,.86);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);box-shadow:0 30px 80px rgba(0,0,0,.55);overflow:hidden;animation:thin .45s cubic-bezier(.22,1,.36,1) both}
@keyframes thin{from{opacity:0;transform:translateY(-8px) scale(.97);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.thhead{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.thhead input{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.3);color:var(--text);font:13.5px var(--sans)}
.thlist{overflow-y:auto;padding:6px 8px 12px;overscroll-behavior:contain}
.thg{padding:12px 8px 4px;font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.thi{display:flex;align-items:center;gap:8px;padding:9px 8px 9px 12px;border-radius:14px;cursor:pointer;transition:background .25s}
.thi:hover{background:rgba(255,255,255,.06)}
.thi.cur{background:rgba(182,156,255,.14);box-shadow:inset 2px 0 0 #b69cff}
.thi .tt{flex:1;min-width:0}
.thi .tt b{display:block;font-weight:500;font-size:14px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thi .tt small{display:block;font-size:11.5px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thi .tt input{width:100%;padding:5px 8px;border:1px solid rgba(182,156,255,.6);border-radius:8px;background:rgba(0,0,0,.35);color:var(--text);font:14px var(--sans)}
.thi button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--mute);opacity:0;transition:opacity .2s,color .2s,background .2s}
.thi:hover button,.thi.cur button{opacity:1}
.thi button:hover{color:var(--text);background:rgba(255,255,255,.08)}
.thi button[data-del]:hover{color:#ff8f7a}
.thi button svg{width:14px;height:14px}
.thnone{padding:24px 12px;text-align:center;color:var(--mute);font-size:13.5px}
@media (max-width:760px){#thPop{left:12px;right:12px;width:auto;top:70px}.thb span{display:none}.thb{padding:7px 10px}}
/* batalla ciega */
.btrow{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.bt-tog{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;color:var(--mute);transition:all .3s}
.bt-tog[aria-pressed="true"]{color:#ffd2c8;border-color:rgba(255,143,122,.6);background:rgba(255,143,122,.13)}
.vote{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:14px;border:1px dashed rgba(255,143,122,.5);border-radius:18px;background:rgba(255,143,122,.06);animation:avpop .5s var(--ease) both}
.vote span{width:100%;text-align:center;font-family:var(--serif);font-size:22px}
.cmp-card.win{box-shadow:0 0 0 2px #f2c46b,0 0 40px rgba(242,196,107,.35)}
.cmp-card .who.reveal{animation:avpop .6s var(--ease) both}
.rank{display:grid;gap:6px;margin-top:12px}
.rank div{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;font-size:13.5px}
.rank i{font-style:normal;font-family:var(--mono);color:var(--mute)}
.rank b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--soft)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="zgrad" x1="0" y1="0" x2="1" y2="1"><animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="16s" repeatCount="indefinite"/><stop offset="0" stop-color="#8fb0ff"/><stop offset=".55" stop-color="#b69cff"/><stop offset="1" stop-color="#ff8f7a"/></linearGradient></defs></svg>

    <div class="slbl">Proveedor</div>

    <label class="field search" id="searchBox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="text" placeholder="Buscar modelo o proveedor…" autocomplete="off" spellcheck="false" aria-label="Buscar modelo">
      <kbd>/</kbd>
      <button type="button" class="qx" id="qClear" aria-label="Borrar búsqueda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </label>
    <div class="filters" id="filters"></div>
    <div class="sortrow"><span class="slbl" style="margin:0"><b id="liveN">0</b> modelos</span><div class="live" id="live" data-s="loading">      <span class="live-dot"></span><b id="liveLbl">Conectando…</b><span id="liveAgo"></span><span class="sp"></span>      <button class="refresh" id="refreshBtn" aria-label="Actualizar la lista en vivo" title="Actualizar ahora"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>    </div><div class="seg mini" id="sortSeg" role="tablist" aria-label="Ordenar"><span class="pill"></span>
      <button role="tab" data-s="new" aria-selected="true">Recientes</button>
      <button role="tab" data-s="ctx" aria-selected="false">Contexto</button>
      <button role="tab" data-s="az" aria-selected="false">A–Z</button></div></div>
    <div class="mlist" id="mlist" role="listbox" aria-label="Modelos"></div>
    <div class="side-foot" id="sideFoot"></div>
    <button class="btn sm side-done" id="sideDone">Listo</button>
  </aside>

  <div class="main">
    <header class="top" id="top">
      <button class="menu" id="openSide" aria-label="Elegir modelo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Modelos</button>
      <div class="title" id="title"></div>

      <div class="now" id="now" aria-live="polite"></div>
      <button class="accb out" id="accBtn" type="button" aria-label="Tu cuenta">Entrar</button>
    </header>
    <div class="msgs" id="msgs"><div class="lane" id="lane"></div></div>
    <button class="tobottom" id="toBottom" aria-label="Ir al final"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg></button>

        <input type="file" id="fileIn" multiple hidden accept="image/*,.pdf,.txt,.md,.csv,.tsv,.json,.xml,.html,.css,.js,.ts,.jsx,.tsx,.py,.java,.c,.cpp,.cs,.go,.rs,.php,.rb,.sql,.yml,.yaml,.log">

    </footer>
  </div>
</div>

<script>
/* ===== SynthZ · núcleo compartido (datos, llamadas a las IA, escritura suave, cursor) ===== */
(() => {
'use strict';
const root = document.documentElement;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const NF = new Intl.NumberFormat('es-CO'), fmt = n => NF.format(Math.round(n || 0));
/* configuración de la página: visuales SynthZ-Style o rendimiento para PCs modestos */
const CFG_KEYS = ['cursor', 'smooth', 'favAnim', 'bg', 'glass', 'anim'];
const cfgPreset = perf => CFG_KEYS.reduce((o, k) => (o[k] = perf !== 'speed', o), {});
const CFG = (() => {
  let c = {}; try{ c = JSON.parse(localStorage.getItem('synthz:cfg')) || {}; }catch(e){}
  if (c.v !== 2) c = Object.assign(cfgPreset(c.perf), { perf:c.perf || 'visual' });   /* migración: los ajustes concuerdan con el modo */
  return Object.assign({ v:2, perf:'visual', intro:'always' }, cfgPreset(c.perf), c);
})();
const PERF = CFG.perf === 'speed';
const reduce = !CFG.anim;
function cfgClasses(){ const r = document.documentElement; r.classList.toggle('nocur', !CFG.cursor); r.classList.toggle('noglass', !CFG.glass); r.classList.toggle('nobg', !CFG.bg); r.classList.toggle('noanim', !CFG.anim); r.classList.remove('perf'); }
cfgClasses();
function saveCfg(){ try{ localStorage.setItem('synthz:cfg', JSON.stringify(CFG)); }catch(e){} }
const today = () => new Date().toLocaleDateString('en-CA');
const sleepRaw = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const est = s => Math.ceil(s.length / 4);

/* rayo-Z: recta, con el inicio (arriba izquierda) y el final (abajo derecha) en forma de rayo */
const Z_PATH = 'M13 4H44V12L18 36H49L39 40H45L35 44H4V36L30 12H-1L9 8H3Z';

/* ---------- logos de cada IA ---------- */
const ICONS = {
  puter: (c, d) => `<circle cx="7" cy="12" r="5" fill="${d}" opacity=".9"/><circle cx="12" cy="12" r="5" fill="${c}" opacity=".9"/><circle cx="17" cy="12" r="5" fill="#ff8f7a" opacity=".85"/>`,
  groq: (c, d) => `<path d="M19.2 7.2A8.6 8.6 0 1 0 20.6 12.9H12.6" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12.6" cy="12.9" r="1.7" fill="${d}"/>`,
  gemini: (c, d) => `<path d="M12 1.5C12.4 7.8 16.2 11.6 22.5 12C16.2 12.4 12.4 16.2 12 22.5C11.6 16.2 7.8 12.4 1.5 12C7.8 11.6 11.6 7.8 12 1.5Z" fill="${c}"/><path d="M19.5 2.5C19.6 4 20.5 4.9 22 5C20.5 5.1 19.6 6 19.5 7.5C19.4 6 18.5 5.1 17 5C18.5 4.9 19.4 4 19.5 2.5Z" fill="${d}"/>`,
  mistral: (c, d) => [[0,0],[4,0],[0,1],[1,1],[3,1],[4,1],[0,2],[2,2],[4,2],[0,3],[4,3],[0,4],[4,4]]
    .map(([x, y]) => `<rect x="${2 + x * 4}" y="${2 + y * 4}" width="3.5" height="3.5" rx=".6" fill="${y < 2 ? c : d}"/>`).join(''),
  openrouter: (c, d) => `<path d="M2 15.5H6.8C10.6 15.5 10.8 8 15 8H19.5" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 15.5H6.8C10.6 15.5 10.8 20.5 15 20.5H19.5" fill="none" stroke="${d}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 4.8L22 8L18 11.2M18 17.3L22 20.5L18 23.7" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`,
  claude: (c, d) => [10, 6.8, 9.2, 6.2, 10.4, 6.6, 9.4, 6.2, 10, 7, 9, 6.4].map((l, i) => {
    const a = (i * 30 - 90) * Math.PI / 180;
    return `<line x1="12" y1="12" x2="${(12 + Math.cos(a) * l).toFixed(2)}" y2="${(12 + Math.sin(a) * l).toFixed(2)}" stroke="${i % 2 ? d : c}" stroke-width="2.3" stroke-linecap="round"/>`;
  }).join(''),
  chatgpt: (c, d) => [0, 1, 2, 3, 4, 5].map(i => `<rect x="8.6" y="1.7" width="6.8" height="12.2" rx="3.4" fill="none" stroke="${i % 2 ? d : c}" stroke-width="1.7" transform="rotate(${i * 60} 12 12)"/>`).join('')
};
const ico = p => `<i class="lg" aria-hidden="true"><svg viewBox="0 0 24 24">${ICONS[p.id](p.c, p.d)}</svg></i>`;
const zWord = (txt = 'Synth') => `${txt}<svg class="zb" viewBox="0 0 48 48" aria-hidden="true"><path d="${Z_PATH}" fill="url(#zgrad)"/></svg>`;

/* ---------- datos ---------- */
const API = [
  { id:'openrouter', name:'OpenRouter', c:'#b69cff', d:'#8fb0ff', kind:'openai', url:'https://openrouter.ai/api/v1', keyUrl:'https://openrouter.ai/keys',
    desc:'Conecta tu llave de OpenRouter y usa sus modelos gratuitos (etiqueta :free), incluido gpt-oss de OpenAI.', models:['openai/gpt-oss-20b:free','meta-llama/llama-3.3-70b-instruct:free'] }
];
const MANUAL = [];
const USAGE_EXTRA = [{ id:'puter', name:'Puter', c:'#6fd3d6', d:'#8fb0ff', est:true }];
const ALL = [...API, ...MANUAL, ...USAGE_EXTRA];
const byId = id => ALL.find(p => p.id === id);

/* ---------- estado guardado (con limpieza por si el archivo viene dañado) ---------- */
const KEY = 'synthz:v1', OLD = 'coro:v1';
let memState = null;
function load(){
  try{ const s = localStorage.getItem(KEY) || localStorage.getItem(OLD); return s ? JSON.parse(s) : null; }
  catch(e){ return memState; }
}
const num = v => (Number.isFinite(+v) && +v > 0) ? Math.round(+v) : 0;
function cleanUsage(u){
  const out = {};
  if (!u || typeof u !== 'object') return out;
  ALL.forEach(p => {
    const s = u[p.id]; if (!s || typeof s !== 'object') return;
    const days = {};
    if (s.days && typeof s.days === 'object') Object.keys(s.days).forEach(k => { if (/^\d{4}-\d{2}-\d{2}$/.test(k)) days[k] = num(s.days[k]); });
    out[p.id] = { prompt:num(s.prompt), completion:num(s.completion), requests:num(s.requests), days };
  });
  return out;
}
function cleanChats(c){
  const out = {};
  if (!c || typeof c !== 'object') return out;
  Object.keys(c).forEach(k => {
    if (!Array.isArray(c[k]) || !(byId(k) || /^openrouter::./.test(k))) return;
    out[k] = c[k].filter(m => m && (m.role === 'user' || m.role === 'assistant') && typeof m.content === 'string')
      .map(m => ({ role:m.role, content:m.content, meta: typeof m.meta === 'string' ? m.meta : undefined, model: typeof m.model === 'string' ? m.model : undefined,
        files: Array.isArray(m.files) ? m.files.slice(0, 8).map(f => ({ name:String((f && f.name) || ''), kind:String((f && f.kind) || ''), text: typeof (f && f.text) === 'string' ? f.text : undefined, thumb: typeof (f && f.thumb) === 'string' ? f.thumb : undefined })) : undefined }));
  });
  return out;
}
function cleanStrMap(o){
  const out = {};
  if (!o || typeof o !== 'object') return out;
  Object.keys(o).forEach(k => { if (typeof o[k] === 'string') out[k] = o[k]; });
  return out;

(function(){
  const f = $('#filters'); if (!f) return;
  const w = document.createElement('div'); w.className = 'fwrap'; f.parentNode.insertBefore(w, f); w.appendChild(f);
  const ar = d => '<button class="farr ' + (d < 0 ? 'lft' : 'rgt') + '" type="button" aria-label="' + (d < 0 ? 'Ver filtros anteriores' : 'Ver más filtros') + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="' + (d < 0 ? 'M15 6l-6 6 6 6' : 'M9 6l6 6-6 6') + '"/></svg></button>';
  w.insertAdjacentHTML('beforeend', ar(-1) + ar(1));
  $('.farr.lft', w).addEventListener('click', () => f.scrollBy({ left:-160 }));
  $('.farr.rgt', w).addEventListener('click', () => f.scrollBy({ left:160 }));
  const edges = () => { const m = f.scrollWidth - f.clientWidth; f.classList.toggle('l', f.scrollLeft > 3); f.classList.toggle('r', f.scrollLeft < m - 3); };
  f.addEventListener('scroll', edges, { passive:true }); addEventListener('resize', edges); setTimeout(edges, 200); setTimeout(edges, 1500);
  f.addEventListener('wheel', e => { if (f.scrollWidth > f.clientWidth && Math.abs(e.deltaY) > Math.abs(e.deltaX)){ e.preventDefault(); f.scrollLeft += e.deltaY; } }, { passive:false });
  let down = null, moved = false;
  f.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse' || e.button) return; down = { x:e.clientX, s:f.scrollLeft }; moved = false; });
  addEventListener('pointermove', e => { if (!down) return; const dx = e.clientX - down.x; if (!moved && Math.abs(dx) > 5){ moved = true; f.classList.add('dragging'); } if (moved) f.scrollLeft = down.s - dx; });
  addEventListener('pointerup', () => { if (!down) return; down = null; setTimeout(() => f.classList.remove('dragging'), 0); });
  f.addEventListener('click', e => { if (moved){ e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
})();

function copyText(txt){
  const done = () => true;
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt));
  return Promise.resolve(fallbackCopy(txt));
}
function fallbackCopy(txt){ const t = document.createElement('textarea'); t.value = txt; t.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(t); t.select(); try{ document.execCommand('copy'); }catch(e){} t.remove(); return true; }
function flash(btn, label){ const old = btn.innerHTML; btn.classList.add('ok'); btn.textContent = label; setTimeout(() => { btn.classList.remove('ok'); btn.innerHTML = old; }, 1300); }
lane.addEventListener('click', async e => {

  const act = e.target.closest('.act');
  if (act){
    const msg = act.closest('.m, .cmp-card');
    if (act.dataset.a === 'copy'){ await copyText(msg._raw || ''); flash(act, 'Copiado'); }
    else if (act.dataset.a === 'regen') regen();
    return;
  }
  const sg = e.target.closest('.sugg button'); if (sg) typeIntoComposer(sg.dataset.s);
});
function typeIntoComposer(text){
  if (Object.keys(busy).length) return;
  inp.focus(); inp.value = '';

}

/* ---------- archivos: imágenes, PDF y texto/código ---------- */
const files = []; let fid = 0;
const TEXTX = /\.(txt|md|markdown|csv|tsv|json|jsonl|xml|html?|css|scss|js|mjs|jsx|ts|tsx|py|java|c|h|cpp|hpp|cs|go|rs|rb|php|sh|bat|sql|yml|yaml|toml|ini|log|tex|swift|kt|r|lua|vue|svelte)$/i;
const CAP = 40000, clip = t => t.length > CAP ? t.slice(0, CAP) + '\n…(archivo recortado)' : t;
function readImg(file){
  return new Promise((ok, no) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const mk = max => { const s = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.max(1, Math.round(im.width * s)); c.height = Math.max(1, Math.round(im.height * s)); const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height); return c; };
      const r = { dataUrl: mk(1568).toDataURL('image/jpeg', .85), thumb: mk(96).toDataURL('image/jpeg', .7) };
      URL.revokeObjectURL(url); ok(r);
    };
    im.onerror = () => { URL.revokeObjectURL(url); no(new Error('No pude leer la imagen ' + file.name + '.')); };
    im.src = url;
  });
}
let pdfP;
function loadPdf(){
  return pdfP || (pdfP = (async () => {
    const B = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    await new Promise((ok, no) => { const s = document.createElement('script'); s.src = B + 'pdf.min.js'; s.onload = ok; s.onerror = () => no(new Error('No pude cargar el lector de PDF. Revisa tu internet.')); document.head.appendChild(s); });
    const w = await (await fetch(B + 'pdf.worker.min.js')).text();
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([w], { type:'text/javascript' }));
    return window.pdfjsLib;
  })().catch(e => { pdfP = null; throw e; }));
}
async function readPdf(file){
  const lib = await loadPdf(), pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  let t = '';
  for (let i = 1; i <= Math.min(pdf.numPages, 60) && t.length < CAP; i++){
    const tc = await (await pdf.getPage(i)).getTextContent();
    t += '\n--- página ' + i + ' ---\n' + tc.items.map(x => x.str).join(' ');
  }
  if (t.replace(/--- página \d+ ---/g, '').trim().length < 20) throw new Error('Ese PDF parece escaneado (sin texto). Prueba subiéndolo como imagen.');
  return clip(t.trim());
}
function renderTray(){

/* mensajes que viajan a la IA. Para ahorrar SynXCoin's: los archivos solo se reenvían
   completos en el último mensaje que los trajo, y el modo ahorro manda menos historial */
function apiMsgs(chat, vision, o = {}){
  const saver = !o.naive && st().sx.saver, keepN = saver ? 6 : 20;
  let lastF = -1;
  if (!o.naive) for (let i = chat.length - 1; i >= 0; i--) if (chat[i].role === 'user' && chat[i].files && chat[i].files.length){ lastF = i; break; }
  const start = Math.max(0, chat.length - keepN);
  const h = chat.slice(start).map((m, j) => {
    if (m.role !== 'user' || !m.files || !m.files.length) return { role:m.role, content:m.content };
    const full = o.naive || start + j === lastF;
    let t = m.content || '';
    m.files.forEach(f => {
      if (f.text) t += full ? '\n\n[Archivo adjunto: ' + f.name + ']\n```\n' + (saver && f.text.length > 12000 ? f.text.slice(0, 12000) + '\n…(recortado por el modo ahorro)' : f.text) + '\n```' : '\n\n[Archivo adjunto antes: ' + f.name + ' (no se reenvía para ahorrar SynXCoin\'s)]';
      else if (f.kind === 'img' && !(vision && m._imgs && full)) t += '\n\n[Imagen adjunta: ' + f.name + (full ? ' (ya no está disponible)' : ' (no se reenvía)') + ']';
    });
    const imgs = vision && m._imgs && full ? m._imgs : [];
    t = t.trim() || 'Mira la imagen.';
    return imgs.length ? { role:m.role, content:[{ type:'text', text:t }, ...imgs.map(u => ({ type:'image_url', image_url:{ url:u } }))] } : { role:m.role, content:t };
  });
  while (h.length && h[0].role !== 'user') h.shift();
  if (saver) h.unshift({ role:'system', content:'Responde en el idioma del usuario, de forma clara y breve, sin relleno.' });
  return h;
}
function msgCost(msgs){ return msgs.reduce((n, m) => n + 4 + (typeof m.content === 'string' ? est(m.content) : m.content.reduce((k, x) => k + (x.type === 'text' ? est(x.text) : 800), 0)), 0); }
/* caché: la misma pregunta al mismo modelo no se vuelve a pagar */
const CACHE_KEY = 'synthz:cache';
function hashStr(s){ let h = 5381; for (let i = 0; i < s.length; i++) h = (h * 33 + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36) + s.length.toString(36); }

function cacheGet(k){ const c = cacheAll()[k]; return c && Date.now() - c.t < 7 * 864e5 ? c : null; }
function cachePut(k, r){
  const c = cacheAll(); c[k] = { t:Date.now(), text:r.text, prompt:r.prompt, completion:r.completion, model:r.model };
  const ks = Object.keys(c).sort((a, b) => c[b].t - c[a].t); ks.slice(60).forEach(x => delete c[x]);
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify(c)); }catch(e){}
}

  const chat = chatArr(), sent = files.splice(0).filter(f => f.state === 'ok');

async function runSolo(onFail, o = {}){
  const mid = selId(), chat = chatArr(), g = gen, vis = info(mid).vision, saver = st().sx.saver;
  const sent = apiMsgs(chat, vis), naive = apiMsgs(chat, vis, { naive:true }), ck = hashStr(mid + '|' + saver + '|' + JSON.stringify(sent));
  const canCache = !sent.some(m => Array.isArray(m.content));
  busy[mid] = 'think'; renderMsgs(); renderNow();
  let el = null, rv = null;
  const here = () => g === gen && mode === 'solo' && mid === selId();
  const mount = () => {
    if (el || !here()) return;
    busy[mid] = 'write'; renderNow();
    const t = $('.think-wrap', lane); if (t) t.remove();
    const e = $('.empty', lane); if (e) e.remove();
    $$('.m.last', lane).forEach(x => x.classList.remove('last'));
    el = botEl(mid); el.classList.add('writing'); lane.appendChild(el); stick = true;
    const body = $('.body', el), tk = $('.tk', el);
    rv = SZ.mkReveal(body, (s, n) => { tk.textContent = fmt(Math.ceil(s / 4)); el.style.setProperty('--p', n ? (s / n).toFixed(3) : 0); follow(); });
  };

    let r = !o.fresh && canCache ? cacheGet(ck) : null;
    if (r){ r = Object.assign({}, r, { ms:0, cached:true }); st().sx.saved += r.prompt + r.completion; st().sx.hits += 1; save(); mount(); if (rv) rv.push(r.text); }
    else {
      const ctl = new AbortController(); ctls.add(ctl);
      try{ r = await SZ.askStream(OR, sent, { model:mid, maxTokens: saver ? 700 : 0, signal:ctl.signal }, txt => { mount(); if (rv) rv.push(txt); }); }finally{ ctls.delete(ctl); }
      addUsage(SZ.provOf(mid), r.prompt, r.completion);
      st().sx.saved += Math.max(0, msgCost(naive) - msgCost(sent)); save();
      if (canCache && !r.aborted) cachePut(ck, r);
    }
    if (g !== gen){ if (rv) rv.skip(); return; }
    const msg = { role:'assistant', content:r.text, meta:metaOf(r) + (r.aborted ? ' · detenido' : ''), model:mid };
    chat.push(msg); touchThread(); save();

}

let connEl = null;
function puterOn(){ return !!(window.puter && puter.auth && puter.auth.isSignedIn()); }
function orOn(){ return !!(st().keys.openrouter || st().teamKey); }
function connected(id){ return /^pu:/.test(String(id)) ? puterOn() : orOn(); }
function needsConn(){ return (mode === 'cmp' ? st().cmp : [selId()]).some(id => !connected(id)); }
async function puterSignIn(opts){
  if (!window.puter){ showBlockHelp(window.__puterBlocked ? 'script' : 'script'); throw Object.assign(new Error('sin puter'), { shown:true }); }
  try{ return await puter.auth.signIn(opts || {}); }
  catch(e){ if (e && (e.error === 'popup_blocked' || e.code === 'popup_blocked')){ showBlockHelp('popup'); throw Object.assign(new Error('popup'), { shown:true }); } throw e; }
}
function mScore(m){ const b = (m.id.match(/(\d{2,3})b/i) || [])[1]; return (b ? +b : 20) + (m.reasoning ? 25 : 0) + Math.min(m.ctx, 262144) / 8000 + (/gpt-oss|deepseek|qwen|llama-3\.3|gemini|kimi|glm/i.test(m.id) ? 15 : 0) + (/^pu:/.test(m.id) && /gpt-5|gemini-3|claude|deepseek/i.test(m.id) ? 40 : 0) - (/nano|lite|mini/i.test(m.id) ? 10 : 0) + (/gpt-5\.6-luna$/i.test(m.id) ? 30 : 0) + (/apodex/i.test(m.id) ? 45 : 0); }
function bestOf(prefix){ const l = cat.list.filter(m => m.id.startsWith(prefix + ':') && (m.free || prefix === 'pu')); if (prefix === 'or'){ const ap = l.find(m => /apodex/i.test(m.id)); if (ap) return ap; } return l.length ? l.slice().sort((a, b) => mScore(b) - mScore(a))[0] : null; }
function switchProv(prefix){
  if (mode !== 'solo') setMode('solo');
  const b = bestOf(prefix);
  if (!b){ toast('No encontré modelos de ' + (prefix === 'pu' ? 'Puter' : 'OpenRouter') + ' ahora mismo.'); return; }
  pickModel(b.id, null); toast('Cambié a ' + b.name + '.');
  if (!connected(b.id)) openConnect();
}
/* el mejor modelo que ya puedes usar; si no hay ninguno, el mejor de Puter (solo pide un clic) */
function bestUsable(strict){
  const l = cat.list.filter(m => m.free || /^pu:/.test(m.id)); if (!l.length) return null;
  const ok = l.filter(m => connected(m.id)), pu = l.filter(m => /^pu:/.test(m.id));
  const pool = ok.length ? ok : strict ? [] : pu;
  if (!pool.length) return null;
  return pool.slice().sort((a, b) => mScore(b) - mScore(a))[0];
}
/* si el modelo elegido no se puede usar pero hay otro conectado, cambia solo */
function fixModel(quiet){
  if (mode !== 'solo' || !cat.list.length) return false;
  const cur = selId(), missing = !idx.has(cur);
  if (/^pu:/.test(cur) && !window.__puterBlocked && !cat.list.some(m => /^pu:/.test(m.id))) return false;
  if (!missing && st().pinned === cur) return false;
  if (!missing && connected(cur)) return false;
  const b = bestUsable(!missing);
  if (!b || b.id === cur) return false;
  pickModel(b.id, null);
  if (!quiet) toast('Te puse ' + b.name + ', que ya puedes usar.');
  return true;
}
function afterConnect(msg){ try{ SZ.accStart(); }catch(e){} toast(msg); burst(innerWidth / 2, innerHeight / 2); fixModel(true); refresh(true); renderMsgs(); updateHint(); }
/* se llama dentro del clic/Enter: así el inicio de sesión de Puter no queda bloqueado */
async function ensureConn(){
  if (!needsConn()) return true;
  if (fixModel(false) && !needsConn()) return true;
  const ids = mode === 'cmp' ? st().cmp : [selId()];
  if (window.puter && ids.every(id => connected(id) || /^pu:/.test(id))){

}

const TEAMF = 'SynthZ-equipo.json';

function teamPayload(){ const t = Object.assign({}, st().team); delete t.key; if (t.shareKey && st().keys.openrouter) t.key = st().keys.openrouter; return t; }
async function teamWrite(){ await puter.fs.write(TEAMF, JSON.stringify(teamPayload()), { overwrite:true }); }
async function teamCreate(name){ st().team = { v:1, name, owner:myUser(), created:Date.now(), members:[], shareKey:false }; await teamWrite(); save(); }
async function teamInvite(who){
  const t = st().team; if (t.members.some(m => m.who.toLowerCase() === who.toLowerCase())) throw new Error(who + ' ya está en tu equipo.');

function arenaVote(winner, ids){
  const A = st().arena || (st().arena = {}), g = id => A[id] || (A[id] = { r:1000, w:0, l:0, t:0 });
  ids.forEach(id => g(id).t++);
  if (winner === 'tie'){ for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++){ const a = g(ids[i]), b = g(ids[j]), ea = 1 / (1 + Math.pow(10, (b.r - a.r) / 400)); a.r += 24 * (.5 - ea); b.r -= 24 * (.5 - ea); } }
  else ids.filter(x => x !== winner).forEach(l => { const a = g(winner), b = g(l), ea = 1 / (1 + Math.pow(10, (b.r - a.r) / 400)); a.r += 24 * (1 - ea); b.r -= 24 * (1 - ea); a.w++; b.l++; });
  save();
}

requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(() => { root.classList.add('go'); if (enter){ SZ.portalReveal(pz); SZ.waterIn($('.shell')); setTimeout(renderNow, 1500); } }, enter ? 120 : 0)));

const q = pendingQ || params.get('q'), fromHome = !!pendingQ;
try{ if (!q && !localStorage.getItem('synthz:tour')) setTimeout(openTour, enter ? 2700 : 900); else setTimeout(warnBlocked, enter ? 2700 : 900); }catch(e){}
