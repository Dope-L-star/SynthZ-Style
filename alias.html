<!-- Hecho por: CONSTRUCTOR -->
<!DOCTYPE html>
<html lang="es" data-brand="alias">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b0820">
<title>A.L.I.A.S. · SymphorIA</title>
<meta name="robots" content="noindex">
<script>try{var s=localStorage.getItem('synthz:alias:scheme');if(s!=='light'&&s!=='dark')s=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.scheme=s}catch(e){document.documentElement.dataset.scheme='dark'}</script>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Chakra+Petch:wght@500;600;700&family=Figtree:wght@300..800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="alias.css">
</head>
<body>
<a class="skip" href="#main" data-i18n="saltar"></a>
<svg class="defs" width="0" height="0" aria-hidden="true" focusable="false"><defs><linearGradient id="alG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3de0ff"/><stop offset=".4" stop-color="#7b3ff2"/><stop offset=".72" stop-color="#ff3d9a"/><stop offset="1" stop-color="#ff7a45"/></linearGradient></defs></svg>
<div class="bg" aria-hidden="true"><canvas id="alStars"></canvas><svg class="rib" viewBox="0 0 1440 700" preserveAspectRatio="xMidYMid slice" fill="none" stroke-linecap="round"><g class="rg"><path d="M-120 520C220 440 420 590 760 490S1240 270 1600 360" stroke="#7b3ff2" stroke-width="13"/><path d="M-120 534C220 454 420 604 760 504S1240 284 1600 374" stroke="#ff3d9a" stroke-width="10"/><path d="M-120 546C220 466 420 616 760 516S1240 296 1600 386" stroke="#ff7a45" stroke-width="8"/></g><g><path d="M-120 520C220 440 420 590 760 490S1240 270 1600 360" stroke="#7b3ff2" stroke-width="10"/><path d="M-120 534C220 454 420 604 760 504S1240 284 1600 374" stroke="#ff3d9a" stroke-width="7"/><path d="M-120 546C220 466 420 616 760 516S1240 296 1600 386" stroke="#ff7a45" stroke-width="5"/><path d="M-120 556C220 476 420 626 760 526S1240 306 1600 396" stroke="#ffc857" stroke-width="3"/><path d="M-120 566C220 486 420 636 760 536S1240 316 1600 406" stroke="#3de0ff" stroke-width="1.6"/></g></svg></div>
<div id="aliasLive" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

<header class="top">
  <a class="brand" href="alias.html" aria-label="A.L.I.A.S.">
    <svg class="brand-mark" viewBox="-3 0 50 30" aria-hidden="true" focusable="false"><path class="lp" d="M22 15C18 9 13 6 8 6a9 9 0 0 0 0 18c5 0 10-3 14-9s9-9 14-9a9 9 0 0 1 0 18c-5 0-10-3-14-9z" fill="none" stroke="url(#alG)" stroke-width="2.2"/><g class="nd" fill="#fff"><circle cx="8" cy="6" r="2.2"/><circle cx="-1" cy="15" r="2.2"/><circle cx="8" cy="24" r="2.2"/><circle cx="22" cy="15" r="2.6"/><circle cx="36" cy="6" r="2.2"/><circle cx="45" cy="15" r="2.2"/><circle cx="36" cy="24" r="2.2"/></g><circle class="trav" r="2.4" fill="#3de0ff"><animateMotion dur="4.5s" repeatCount="indefinite" path="M22 15C18 9 13 6 8 6a9 9 0 0 0 0 18c5 0 10-3 14-9s9-9 14-9a9 9 0 0 1 0 18c-5 0-10-3-14-9z"/></circle></svg>
    <span class="brand-name">A.L.I.A.S.</span>
  </a>
  <span class="brand-sub" data-i18n="marca_sub"></span>
  <div class="tools">
    <a class="toflow" href="chat.html" data-i18n="ir_flow"></a>
    <div class="langs" role="group" data-i18n-aria="idioma">
      <button type="button" data-lang="es" data-alias="lang-es" lang="es" aria-pressed="true" data-i18n-aria="idioma_es">ES</button>
      <button type="button" data-lang="en" data-alias="lang-en" lang="en" aria-pressed="false" data-i18n-aria="idioma_en">EN</button>
    </div>
    <button type="button" id="schemeBtn" class="iconbtn" aria-label="Tema"></button>
  </div>
</header>

<main id="main" tabindex="-1">

  <!-- 1 · pantalla inicial -->
  <section id="vHome" aria-labelledby="homeTitle">
    <div class="emb" aria-hidden="true"><svg viewBox="-6 -2 56 34"><path class="lp" d="M22 15C18 9 13 6 8 6a9 9 0 0 0 0 18c5 0 10-3 14-9s9-9 14-9a9 9 0 0 1 0 18c-5 0-10-3-14-9z" fill="none" stroke="url(#alG)" stroke-width="1.6"/><g class="nd"><circle cx="8" cy="6" r="1.7"/><circle cx="-1" cy="15" r="1.7"/><circle cx="8" cy="24" r="1.7"/><circle cx="22" cy="15" r="2.1"/><circle cx="36" cy="6" r="1.7"/><circle cx="45" cy="15" r="1.7"/><circle cx="36" cy="24" r="1.7"/></g><circle class="trav" r="1.9"><animateMotion dur="6s" repeatCount="indefinite" path="M22 15C18 9 13 6 8 6a9 9 0 0 0 0 18c5 0 10-3 14-9s9-9 14-9a9 9 0 0 1 0 18c-5 0-10-3-14-9z"/></circle><circle class="trav t2" r="1.4"><animateMotion dur="6s" begin="-3s" repeatCount="indefinite" path="M22 15C18 9 13 6 8 6a9 9 0 0 0 0 18c5 0 10-3 14-9s9-9 14-9a9 9 0 0 1 0 18c-5 0-10-3-14-9z"/></circle></svg></div>
    <p class="eyebrow"><b>A.L.I.A.S.</b> <span data-i18n="home_eyebrow"></span></p>
    <h1 id="homeTitle" data-i18n="home_titulo"></h1>
    <p class="lead" data-i18n="home_sub"></p>
    <form id="goalForm" class="glass" novalidate>
      <label for="goalInput" class="sr-only" data-i18n="goal_label"></label>
      <textarea id="goalInput" data-alias="goal" rows="4" maxlength="500" autocomplete="off" data-i18n-ph="goal_ph"></textarea>
      <p id="homeMsg" class="msg" role="alert" hidden></p>
      <div class="row">
        <small class="hint" data-i18n="goal_hint"></small>
        <button class="btn primary" id="goBtn" data-alias="plan-submit" type="submit" data-i18n="goal_btn"></button>
      </div>
    </form>
    <h2 class="sub" data-i18n="tpl_titulo"></h2>
    <div id="tplList" class="tpls">
      <button type="button" class="tpl" data-tpl="inv"><span class="tpl-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></span><span class="tpl-t" data-i18n="tpl_inv_t"></span><span class="tpl-d" data-i18n="tpl_inv_d"></span></button>
      <button type="button" class="tpl" data-tpl="pres"><span class="tpl-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2.5"/><path d="M8 20h8M12 16v4M8 12v-2M12 12V8M16 12v-3"/></svg></span><span class="tpl-t" data-i18n="tpl_pres_t"></span><span class="tpl-d" data-i18n="tpl_pres_d"></span></button>
      <button type="button" class="tpl" data-tpl="est"><span class="tpl-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="4" height="15" rx="1"/><rect x="9.5" y="3.5" width="4" height="16.5" rx="1"/><path d="m15.6 6.2 3.7-1 3.4 13.6-3.7 1z"/></svg></span><span class="tpl-t" data-i18n="tpl_est_t"></span><span class="tpl-d" data-i18n="tpl_est_d"></span></button>
      <button type="button" class="tpl" data-tpl="cod"><span class="tpl-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M13.5 4.5l-3 15"/></svg></span><span class="tpl-t" data-i18n="tpl_cod_t"></span><span class="tpl-d" data-i18n="tpl_cod_d"></span></button>
    </div>
    <p class="hint foot" data-i18n="home_nota"></p>
  </section>

  <!-- 2 · plan, controles y resultado -->
  <section id="vPlan" data-alias="plan" hidden aria-labelledby="planTitle">
    <h2 id="planTitle" class="h-plan" tabindex="-1" data-i18n="plan_titulo"></h2>
    <p class="goal"><b data-i18n="plan_obj"></b> <span id="planGoal"></span></p>
    <p id="editHint" class="hint" data-i18n="plan_edit_hint"></p>
    <div class="prog"><progress id="progress" max="1" value="0"></progress><span id="progTxt" class="hint"></span></div>
    <ol id="stepList" class="steps" data-i18n-aria="pasos_lista_aria"></ol>

    <div id="ctl" class="ctl glass">
      <fieldset id="modeBox" class="mode">
        <legend data-i18n="modo_titulo"></legend>
        <label class="opt"><input type="radio" name="mode" value="manual" checked><span><b data-i18n="modo_manual"></b><small data-i18n="modo_manual_d"></small></span></label>
        <label class="opt"><input type="radio" name="mode" value="auto"><span><b data-i18n="modo_auto"></b><small data-i18n="modo_auto_d"></small></span></label>
      </fieldset>
      <p id="ctlMsg" class="ctl-msg" hidden></p>
      <div class="btns">
        <button type="button" class="btn primary" id="bRun" data-alias="run" data-i18n="btn_ejecutar"></button>
        <button type="button" class="btn primary" id="bApprove" data-alias="run" hidden data-i18n="btn_aprobar"></button>
        <button type="button" class="btn primary" id="bResume" data-alias="run" hidden data-i18n="btn_continuar"></button>
        <button type="button" class="btn" id="bPause" data-alias="pause" hidden data-i18n="btn_pausar"></button>
        <button type="button" class="btn ghost" id="bCancel" data-i18n="btn_cancelar"></button>
      </div>
      <p id="redoNote" class="hint" hidden data-i18n="rehacer_nota"></p>
    </div>

    <div id="errBox" class="errbox" role="alert" hidden tabindex="-1">
      <h3 data-i18n="err_titulo"></h3>
      <p id="errStep" class="errstep"></p>
      <p id="errMsg" class="errmsg" data-alias="error"></p>
      <div class="btns" data-alias="decisions">
        <button type="button" class="btn primary" id="bErrRetry" data-i18n="err_otra"></button>
        <button type="button" class="btn" id="bErrSkip" data-i18n="err_seguir"></button>
        <button type="button" class="btn ghost" id="bErrStop" data-i18n="err_parar"></button>
      </div>
    </div>

    <div id="limitBox" class="errbox" role="alert" hidden>
      <h3 data-i18n="err_limite"></h3>
      <p data-i18n="err_limite_d"></p>
      <div class="btns"><button type="button" class="btn" id="bLimitBack" data-i18n="res_nuevo"></button></div>
    </div>

    <section id="vResult" class="result glass" hidden aria-labelledby="resTitle">
      <h2 id="resTitle" tabindex="-1" data-i18n="res_titulo"></h2>
      <p id="resNote" class="hint" hidden></p>
      <div id="resText" class="rtext"></div>
      <div id="resFiles" class="btns" hidden></div>
      <div id="resSrcWrap" hidden>
        <h3 class="sub" data-i18n="res_fuentes"></h3>
        <ul id="resSources" class="srcs"></ul>
      </div>
      <div id="resStepsWrap" hidden>
        <h3 class="sub" data-i18n="res_pasos"></h3>
        <div id="resSteps"></div>
      </div>
      <div class="btns">
        <button type="button" class="btn" id="bCopy">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
          <span data-i18n="res_copiar"></span>
        </button>
        <button type="button" class="btn ghost" id="bNew" data-i18n="res_nuevo"></button>
      </div>
    </section>
  </section>
</main>

<script src="alias-tools.js" defer></script>
<script src="alias.js" defer></script>
</body>
</html>
