<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Sintético · SymphorIA</title>
<!-- v2.9.1 · «Sintéticos» (en inglés, «Synthetics»): lo que crea la IA (páginas, juegos, dibujos) corre aquí, como los artefactos de Claude.
     Es una página aparte, con sus propias reglas (CSP abierta: puede usar cualquier librería, fuente o imagen de internet),
     siempre dentro de un iframe aislado: no ve tu cuenta, tus chats ni el resto de SymphorIA. SynthFlow le manda el código por postMessage. -->
<script>
addEventListener('message', function(e){
  if (e.source !== parent || parent === window || !e.data || e.data.szs !== 'doc') return;
  document.open(); document.write(String(e.data.html || '')); document.close();
});
if (parent !== window) parent.postMessage({ szs:'ready' }, '*');
</script></head><body></body></html>
